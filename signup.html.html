
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Tahoma, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f2f2f2;
        }
        .container {
            width: 400px;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: 0.3s ease-in-out;
        }
        .form-group input:focus {
            border-color: #6C63FF;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #6C63FF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        p {
            margin-top: 15px;
            font-size: 14px;
        }
        a {
            color: #6C63FF;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <form>
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" placeholder="Enter Your Username or Email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter Your Password">
            </div>
            <button type="submit" class="btn">Login</button>
            <p>Don't have an Account? <a href="signup.html">Create Account</a></p>
        </form>
    </div>
</body>
</html>
